<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Server Shop</title>
  <style>
    @font-face {
      font-family: 'Minecraftia';
      src: url('https://cdnjs.cloudflare.com/ajax/libs/ink/3.1.10/fonts/Roboto-Regular.ttf');
    }

    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
      --mc-font: 'VT323', 'Minecraftia', monospace;
      --gui-bg: #c6c6c6;
      --gui-border-light: #ffffff;
      --gui-border-dark: #555555;
      --gui-shadow: #373737;
      --slot-bg: #8b8b8b;
      --slot-border-dark: #373737;
      --slot-border-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000 url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
      background-size: cover;
      font-family: var(--mc-font);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }

    /* Main Container Frame */
    .shop-window {
      position: relative;
      z-index: 10;
      width: 780px;
      background-color: #8b6239;
      background-image: 
        linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)),
        url('https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/oak_planks.png');
      background-size: 64px 64px;
      border: 6px solid #2b1808;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Window Header */
    .shop-header {
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
      border: 3px solid #1a0f05;
      padding: 6px;
    }

    .shop-title {
      font-size: 42px;
      color: #ffaa00;
      text-shadow: 3px 3px 0px #3f2a00, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      margin: 0;
      letter-spacing: 2px;
    }

    /* Category Navigation */
    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .tab-btn {
      font-family: var(--mc-font);
      font-size: 24px;
      padding: 6px 16px;
      background: #727272;
      color: #e0e0e0;
      border: 3px solid;
      border-color: #dbdbdb #3b3b3b #3b3b3b #dbdbdb;
      cursor: pointer;
      text-shadow: 2px 2px 0px #000;
      outline: none;
      transition: all 0.1s;
    }

    .tab-btn:hover {
      background: #8b8b8b;
      color: #ffffff;
    }

    .tab-btn.active {
      background: #55ff55;
      color: #003300;
      text-shadow: none;
      border-color: #aaffaa #00aa00 #00aa00 #aaffaa;
      font-weight: bold;
    }

    /* Grid Area */
    .gui-panel {
      background: #c6c6c6;
      border: 4px solid;
      border-color: #373737 #ffffff #ffffff #373737;
      padding: 16px;
      min-height: 280px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    /* Item Card Component */
    .item-card {
      background: #8b8b8b;
      border: 3px solid;
      border-color: #373737 #ffffff #ffffff #373737;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.05s, background-color 0.1s;
    }

    .item-card:hover {
      background: #9e9e9e;
      transform: scale(1.02);
    }

    .item-slot {
      width: 64px;
      height: 64px;
      background: #8b8b8b;
      border: 3px solid;
      border-color: #373737 #ffffff #ffffff #373737;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    .item-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      z-index: 2;
    }

    /* Enchanted Glint Animation */
    .glint-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg, 
        rgba(128, 0, 128, 0) 0%, 
        rgba(200, 50, 255, 0.45) 50%, 
        rgba(128, 0, 128, 0) 100%
      );
      background-size: 200% 200%;
      animation: enchantmentGlint 2s infinite linear;
      mix-blend-mode: color-dodge;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes enchantmentGlint {
      0% { background-position: -100% -100%; }
      100% { background-position: 200% 200%; }
    }

    .item-title {
      font-size: 22px;
      color: #ffffff;
      text-shadow: 2px 2px 0px #000;
      margin: 4px 0 2px 0;
      text-align: center;
      line-height: 1;
    }

    .item-level {
      font-size: 18px;
      color: #55ffff;
      text-shadow: 2px 2px 0px #000;
      margin-bottom: 8px;
    }

    /* Price Section (Flexibly configurable currency) */
    .item-price-tag {
      margin-top: auto;
      background: rgba(0,0,0,0.3);
      padding: 4px 10px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(0,0,0,0.5);
    }

    .price-label {
      font-size: 18px;
      color: #aaaaaa;
      text-shadow: 1px 1px 0px #000;
    }

    .price-value {
      font-size: 22px;
      color: #ffaa00;
      text-shadow: 2px 2px 0px #000;
      font-weight: bold;
    }

    .currency-icon {
      width: 20px;
      height: 20px;
    }

    /* Footer Buttons */
    .shop-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mc-button {
      font-family: var(--mc-font);
      font-size: 22px;
      padding: 8px 24px;
      background: #727272;
      color: #ffffff;
      border: 3px solid;
      border-color: #dbdbdb #3b3b3b #3b3b3b #dbdbdb;
      cursor: pointer;
      text-shadow: 2px 2px 0px #000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mc-button:hover {
      background: #8b8b8b;
    }

    .mc-button:active {
      border-color: #3b3b3b #dbdbdb #dbdbdb #3b3b3b;
    }

    .btn-close {
      background: #a83232;
      border-color: #ff6b6b #541111 #541111 #ff6b6b;
    }

    .btn-close:hover {
      background: #c44141;
    }

    /* Notification Modal */
    .notification {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #111;
      border: 3px solid #55ff55;
      color: #fff;
      padding: 12px 24px;
      font-size: 22px;
      text-shadow: 2px 2px 0 #000;
      transition: transform 0.3s ease;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .notification.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="shop-window">
    <div class="shop-header">
      <h1 class="shop-title">SERVER SHOP</h1>
    </div>

    <!-- Kategórie obchodu -->
    <div class="category-tabs" id="categoryTabs"></div>

    <!-- Mriežka s predmetmi -->
    <div class="gui-panel">
      <div class="items-grid" id="itemsGrid"></div>
    </div>

    <!-- Spodné tlačidlá -->
    <div class="shop-footer">
      <button class="mc-button" onclick="notify('Acia bola vrátená späť.')">◀ SPÄŤ</button>
      <button class="mc-button btn-close" onclick="notify('Obchod bol zatvorený.')">ZAVRIEŤ ✖</button>
    </div>
  </div>

  <div class="notification" id="notification">
    <span id="notifText">Kúpené!</span>
  </div>

  <script>
    /* 
      ===================================================================
      KONFIGURÁCIA OBCHODU A PREDMETOV
      Menu a menu ikonu si môžeš jednoducho prepísať priamo tu v kóde.
      ===================================================================
    */
    const SHOP_CONFIG = {
      // Predvolená mena pre obchod (ak nie je špecifikovaná pri položke)
      defaultCurrency: "Diamond",
      defaultCurrencyIcon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond.png"
    };

    // Zoznam kategórií
    const categories = ["ENCHANTMENTS", "BLOCKS", "TOOLS"];
    let currentCategory = "ENCHANTMENTS";

    // Zoznam predávaných predmetov
    const shopItems = [
      {
        id: "silk_touch",
        name: "SILK TOUCH",
        level: "I",
        category: "ENCHANTMENTS",
        price: 5, // Cena v diamantoch
        currency: "Diamond",
        currencyIcon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond.png",
        icon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/enchanted_book.png",
        isEnchanted: true
      },
      {
        id: "unbreaking",
        name: "UNBREAKING",
        level: "III",
        category: "ENCHANTMENTS",
        price: 8, // Cena v diamantoch
        currency: "Diamond",
        currencyIcon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond.png",
        icon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/enchanted_book.png",
        isEnchanted: true
      },
      {
        id: "dirt_block",
        name: "DIRT",
        level: "64x",
        category: "BLOCKS",
        price: 1,
        currency: "Diamond",
        currencyIcon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond.png",
        icon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/block/dirt.png",
        isEnchanted: false
      },
      {
        id: "iron_ingot",
        name: "IRON INGOT",
        level: "32x",
        category: "TOOLS",
        price: 3,
        currency: "Diamond",
        currencyIcon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/diamond.png",
        icon: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/iron_ingot.png",
        isEnchanted: false
      }
    ];

    // Vykreslenie kategórií
    function renderCategories() {
      const container = document.getElementById("categoryTabs");
      container.innerHTML = "";
      
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${cat === currentCategory ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          currentCategory = cat;
          renderCategories();
          renderItems();
        };
        container.appendChild(btn);
      });
    }

    // Vykreslenie predmetov podľa vybranej kategórie
    function renderItems() {
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = "";

      const filteredItems = shopItems.filter(item => item.category === currentCategory);

      if (filteredItems.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #777; font-size: 24px; padding: 40px;">V tejto kategórii nie sú žiadne položky.</div>`;
        return;
      }

      filteredItems.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.onclick = () => buyItem(item);

        const currIcon = item.currencyIcon || SHOP_CONFIG.defaultCurrencyIcon;

        card.innerHTML = `
          <div class="item-slot">
            <img src="${item.icon}" class="item-icon" alt="${item.name}">
            ${item.isEnchanted ? '<div class="glint-effect"></div>' : ''}
          </div>
          <div class="item-title">${item.name}</div>
          <div class="item-level">${item.level || ''}</div>
          <div class="item-price-tag">
            <span class="price-label">Cena:</span>
            <span class="price-value">${item.price}</span>
            <img src="${currIcon}" class="currency-icon" title="${item.currency || SHOP_CONFIG.defaultCurrency}">
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Funkcia pre nákup
    function buyItem(item) {
      notify(`Kúpil si: ${item.name} ${item.level || ''} za ${item.price}x Diamond!`);
    }

    // Zobrazenie notifikácie
    function notify(text) {
      const notif = document.getElementById("notification");
      const notifText = document.getElementById("notifText");
      notifText.innerText = text;
      notif.classList.add("show");
      
      clearTimeout(window.notifTimeout);
      window.notifTimeout = setTimeout(() => {
        notif.classList.remove("show");
      }, 3000);
    }

    // Inicializácia pri načítaní stránky
    renderCategories();
    renderItems();
  </script>
</body>
</html>
